# Example only. Do not apply this file as-is and do not commit real credentials.
#
# Create the real Secret out of band, for example:
#
#   kubectl create secret generic rtfm-secrets \
#     --from-literal=sqlServerConnectionString='Server=...;Database=rtfm;...' \
#     --from-literal=redisConnectionString='redis-master:6379'
#
# In a real cluster this comes from a secrets manager (External Secrets, Vault,
# CSI driver), not from a file in the repository.
apiVersion: v1
kind: Secret
metadata:
  name: rtfm-secrets
  labels:
    app.kubernetes.io/name: rtfm-api
type: Opaque
stringData:
  sqlServerConnectionString: "Server=sqlserver,1433;Database=rtfm;User Id=sa;Password=CHANGE_ME;TrustServerCertificate=True;Encrypt=False"
  redisConnectionString: "redis:6379"
