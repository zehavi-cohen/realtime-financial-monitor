<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img"
     aria-label="Ingestion flow. A producer POSTs a transaction to one of five stateless API replicas. The replica validates it, writes it to SQL Server with a MERGE under HOLDLOCK, projects it into the Redis hot window with a single Lua script, then broadcasts it over SignalR. The Redis backplane fans the broadcast out to every replica, which forwards it to its own dashboard sockets. A connecting dashboard is sent the hot window as a snapshot.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8695"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3aa76d"/>
    </marker>
    <style>
      .bg   { fill:#0f1115; }
      .card { fill:#171a21; stroke:#2b3140; stroke-width:1.5; }
      .zone { fill:#13161d; stroke:#2b3140; stroke-width:1.5; stroke-dasharray:6 4; }
      .t    { fill:#e6e9ef; font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif; }
      .m    { fill:#939bab; font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif; }
      .g    { fill:#3aa76d; font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif; }
      .mono { font-family:ui-monospace,'Cascadia Mono',Consolas,monospace; }
      .ln   { stroke:#7d8695; stroke-width:2; fill:none; }
      .lng  { stroke:#3aa76d; stroke-width:2; fill:none; stroke-dasharray:5 4; }
      .num  { fill:#5b8def; font-family:ui-monospace,Consolas,monospace; font-weight:700; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="940" height="520" rx="10"/>

  <!-- ── producer ───────────────────────────────────────────── -->
  <rect class="card" x="64" y="30" width="280" height="52" rx="8"/>
  <text class="t" x="84" y="52" font-size="15" font-weight="600">Producer</text>
  <text class="m" x="84" y="70" font-size="12">the /add simulator, or any HTTP client</text>
  <text class="m" x="360" y="52" font-size="12">receives 201 Created when a row is created,</text>
  <text class="m" x="360" y="70" font-size="12">200 OK for a status change or a no-op</text>

  <path class="ln" d="M204,82 L204,122" marker-end="url(#ar)"/>
  <text class="m mono" x="216" y="107" font-size="12">POST /api/transactions</text>

  <!-- ── replica zone ───────────────────────────────────────── -->
  <rect class="zone" x="40" y="134" width="540" height="340" rx="10"/>
  <text class="t" x="62" y="160" font-size="13" font-weight="600">API replica &#215;5 &#8212; stateless</text>
  <text class="m" x="62" y="178" font-size="11">no replica holds state another replica's clients need</text>

  <!-- 1 -->
  <rect class="card" x="64" y="194" width="270" height="46" rx="8"/>
  <text class="num" x="82" y="222" font-size="13">1</text>
  <text class="t" x="102" y="222" font-size="14">validate</text>
  <text class="m" x="356" y="222" font-size="12">400 naming the offending field</text>
  <path class="ln" d="M199,240 L199,258" marker-end="url(#ar)"/>

  <!-- 2 -->
  <rect class="card" x="64" y="258" width="270" height="54" rx="8"/>
  <text class="num" x="82" y="290" font-size="13">2</text>
  <text class="t" x="102" y="284" font-size="14">SQL Server</text>
  <text class="m mono" x="102" y="302" font-size="11">MERGE &#8230; WITH (HOLDLOCK)</text>
  <text class="m" x="356" y="280" font-size="12">the system of record</text>
  <text class="m" x="356" y="297" font-size="12">answers Created / Updated / Ignored</text>
  <text class="g" x="356" y="314" font-size="12" font-weight="600">durable from here on</text>
  <path class="ln" d="M199,312 L199,330" marker-end="url(#ar)"/>

  <!-- 3 -->
  <rect class="card" x="64" y="330" width="270" height="54" rx="8"/>
  <text class="num" x="82" y="362" font-size="13">3</text>
  <text class="t" x="102" y="356" font-size="14">Redis hot window</text>
  <text class="m mono" x="102" y="374" font-size="11">EVALSHA hot-window.lua</text>
  <text class="m" x="356" y="352" font-size="12">newest 500, one atomic unit</text>
  <text class="m" x="356" y="369" font-size="12">two keys, never out of step</text>
  <path class="ln" d="M199,384 L199,402" marker-end="url(#ar)"/>

  <!-- 4 -->
  <rect class="card" x="64" y="402" width="270" height="46" rx="8"/>
  <text class="num" x="82" y="430" font-size="13">4</text>
  <text class="t" x="102" y="430" font-size="14">SignalR broadcast</text>
  <text class="m" x="356" y="424" font-size="12">on 1 and 2 only</text>
  <text class="m" x="356" y="441" font-size="12">an Ignored message is never pushed</text>

  <!-- ── right column ───────────────────────────────────────── -->
  <rect class="card" x="652" y="34" width="252" height="48" rx="8"/>
  <text class="t" x="778" y="54" font-size="14" font-weight="600" text-anchor="middle">Dashboards &#8212; /monitor</text>
  <text class="m" x="778" y="71" font-size="11" text-anchor="middle">opens already populated</text>

  <rect class="card" x="652" y="300" width="252" height="56" rx="28"/>
  <text class="t" x="778" y="324" font-size="14" font-weight="600" text-anchor="middle">Redis backplane</text>
  <text class="m" x="778" y="342" font-size="11" text-anchor="middle">no replica addresses another</text>

  <!-- 4 -> backplane -->
  <path class="ln" d="M334,425 L610,425 L610,328 L646,328" marker-end="url(#ar)"/>
  <text class="m" x="622" y="398" font-size="11">publish</text>

  <!-- backplane -> dashboards -->
  <path class="ln" d="M778,300 L778,88" marker-end="url(#ar)"/>
  <text class="m" x="790" y="176" font-size="11">every replica forwards</text>
  <text class="m" x="790" y="191" font-size="11">to its own sockets</text>

  <!-- hot window -> snapshot on connect -->
  <path class="lng" d="M334,390 L630,390 L630,58 L646,58" marker-end="url(#ag)"/>
  <text class="g" x="344" y="383" font-size="11">snapshot on connect</text>
</svg>
